name: CI - Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set Python version
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Ninja
        run: choco install ninja -y

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.1"
          archives: qtbase qtsvg qttools

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTEST=ON

      - name: Build app, launcher and upstream tests
        run: cmake --build build --target PokeFinder PokeFinderPlusLauncher PokeFinderTest --parallel 4

      - name: Run upstream regression suite
        run: ctest --test-dir build --output-on-failure
